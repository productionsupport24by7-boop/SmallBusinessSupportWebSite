<div class="contact-container">

  <mat-card>

    <h1>Contact SupportOps Solutions</h1>

    <p>
      Tell us about your IT support needs and we'll get back to you.
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <mat-form-field appearance="outline">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Company</mat-label>
        <input matInput formControlName="company">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          formControlName="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Service Needed</mat-label>

        <mat-select formControlName="service">

          <mat-option value="Production Support">
            Production Support
          </mat-option>

          <mat-option value="SQL Server">
            SQL Server
          </mat-option>

          <mat-option value="Azure">
            Azure Cloud
          </mat-option>

          <mat-option value="DevOps">
            DevOps
          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>Message</mat-label>

        <textarea
          rows="6"
          matInput
          formControlName="message">
        </textarea>

      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="isSubmitting">

        {{ isSubmitting ? 'Submitting...' : 'Submit Request' }}

      </button>

    </form>

  </mat-card>

</div>
