<div class="password-container">
  <div class="password-card">
    <h2>Change Password</h2>
    <p>Enter your current password and choose a new password.</p>

    @if (errorMessage) {
      <div class="alert error" role="alert">{{ errorMessage }}</div>
    }

    @if (successMessage) {
      <div class="alert success" role="status">{{ successMessage }}</div>
    }

    <form #passwordForm="ngForm" (ngSubmit)="changePassword()">
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input
          id="currentPassword"
          name="currentPassword"
          type="password"
          [(ngModel)]="currentPassword"
          required
        />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          required
          minlength="8"
        />
      </div>

      <div class="form-group">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input
          id="confirmNewPassword"
          name="confirmNewPassword"
          type="password"
          [(ngModel)]="confirmNewPassword"
          required
        />
      </div>

      <button type="submit" [disabled]="passwordForm.invalid || isSaving()">
        {{ isSaving() ? 'Updating...' : 'Change Password' }}
      </button>
    </form>
  </div>
</div>
